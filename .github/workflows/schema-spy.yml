name: SchemaSpy report

on:
  workflow_call:
    inputs:
      java_version:
        description: Java version
        type: string
        default: '25'
      java_options:
        description: Java options
        type: string
        default: '-Xmx512m -XX:ParallelGCThreads=2 -XX:ConcGCThreads=2 -Djava.util.concurrent.ForkJoinPool.common.parallelism=2 -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process'
      docker_compose_file:
        description: Path to Docker Compose file to start required containers
        type: string
        required: true
      init_db_cli:
        description: Command line to initialise database
        type: string
        default: './gradlew -Pinit-db=true test --tests uk.gov.justice.digital.hmpps.hmppschallengesupportinterventionplanapi.integration.InitialiseDatabase'
      database_name:
        description: Database name
        type: string
        required: true
      database_user:
        description: Database user name
        type: string
        required: true
      database_password:
        description: Database user password
        type: string
        required: true
      database_schema:
        description: Database schema name
        type: string
        required: true
      publish:
        description: Publish the report to GitHub Pages
        type: boolean
        default: true

jobs:
  schema-spy:
    name: Schema Spy report generation
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: test
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle
          cache-dependency-path: |
            *.gradle*
            **/gradle-wrapper.properties

      - name: Initialise database
        shell: bash
        run: |
          docker compose -f ${{ inputs.docker_compose_file }} up -d
          export JAVA_OPTS="${{ inputs.java_options }}"
          ${{ inputs.init_db_cli }}

      - name: Generate database schema report
        uses: ministryofjustice/hmpps-github-shared-actions/.github/actions/database_schema_report@860f18498f2263bb888da24cafc3c47cc87e3543 # v1.1.0
        with:
          database_name: ${{ inputs.database_name }}
          schema: ${{ inputs.database_schema }}
          user: ${{ inputs.database_user }}
          password: ${{ inputs.database_password }}

      # The shared action above runs SchemaSpy into /tmp/schemaspy and uploads it as a build artifact.
      # It does not publish. Without this step the report is generated and thrown away, which is what
      # happened between May and August 2026 - the job passed on every merge and gh-pages never moved.
      #
      # target-folder clears schema-spy-report/ on each deploy, so stale pages cannot accumulate, and
      # anything at the gh-pages root is left alone.
      - name: Publish to GitHub Pages
        if: ${{ inputs.publish }}
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: /tmp/schemaspy
          target-folder: schema-spy-report
